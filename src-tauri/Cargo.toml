[package]
name = "hestia"
version = "0.1.0"
description = "本地开发服务启动管理器"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hestia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
libc = "0.2.189"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

# 菜单栏面板的「点击别处即收起」要用 AppKit 的全局事件监视器。
# 版本对齐依赖树里 tao 已经在用的那几个，避免同一套 objc2 出现两份。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSResponder", "block2"] }
block2 = "0.6.2"


[dev-dependencies]
tauri = { version = "2", features = ["test"] }
